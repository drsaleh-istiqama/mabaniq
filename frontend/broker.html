<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0F1724">
<title>بوابة الوسيط — مبانيك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--card:#fff;--ink:#152033;--muted:#4F5A70;--line:#E1E6EE;--pri:#9C6E14;--pri2:#F6ECD7;--navy:#0F1724;--ok:#17714A;--ok2:#E2F4EA;--bad:#C24137;--bad2:#FBE6E4;--blue:#1F559E;--blue2:#E5EFFB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto}
header{background:var(--navy);color:#fff;padding:18px 18px 54px}
.top{display:flex;justify-content:space-between;align-items:center}
.lg{display:flex;align-items:center;gap:9px;font-weight:700}.lg i{width:32px;height:32px;border-radius:9px;background:#D4A64A;color:#1A1405;display:grid;place-items:center;font-style:normal}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 12px;font:inherit;font-size:13px}
h1{font-size:20px;margin:16px 0 2px}.sub{color:#AEB8CA;font-size:13px}
main{padding:0 14px 40px;margin-top:-38px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,36,.06)}
.card h2{font-size:16px;margin:0 0 10px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k div{background:var(--bg);border-radius:12px;padding:10px}.k small{color:var(--muted);display:block;font-size:12px}.k b{font-size:18px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.p-ok{background:var(--ok2);color:var(--ok)}.p-w{background:var(--pri2);color:var(--pri)}.p-bl{background:var(--blue2);color:var(--blue)}.p-b{background:var(--bad2);color:var(--bad)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;min-height:46px;width:100%;margin-top:14px}
.btn:disabled{opacity:.55}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.ai{background:var(--pri2);border-radius:12px;padding:12px;font-size:14px;margin-top:10px}
.toast{position:fixed;top:14px;inset-inline:14px;max-width:600px;margin:auto;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}.toast.bad{background:var(--bad)}
@media(max-width:480px){.k b{font-size:15px}.k div{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="top"><div class="lg"><i>م</i>مبانيك · بوابة الوسيط</div><button id="out">خروج</button></div>
 <h1 id="hi">…</h1><div class="sub" id="hsub"></div></header>
<main id="m"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/static/broker.js?v=0.5.0"></script>
</body>
</html>
