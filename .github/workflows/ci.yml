# Continuous integration — Mabaniq (docs/CI.md).
#
#   quality      ruff (lint) · web static checks (parse, no inline handlers, RTL, Western digits) · Vite build + size budget · pip-audit
#   test         pytest on SQLite (the development engine) + selfcheck   (needs the built bundle)
#   test-pg      pytest + pgTAP against PostgreSQL 17 — blocking since Unit 1
#   e2e          Playwright critical path (booking → KYC → contract → signature → payment → bank letter → handover) — Unit 3
#   image        Docker image (node build stage + python) builds and answers /health
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: Lint · static scripts · dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - name: ruff
        run: ruff check backend tests
      - name: Web static checks (parse · no inline handlers/scripts · RTL root · Western digits)
        run: npm run check
      - name: Vite build + initial-JS budget (≤ 200 kB gzip)
        run: npm run build && npm run size
      - name: pip-audit (known vulnerabilities)
        run: pip-audit -r requirements.txt
      - name: npm audit (production tree is empty; dev tooling high+ only)
        run: npm audit --audit-level=high

  test:
    name: pytest (SQLite) + selfcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: selfcheck (demo config)
        run: python -m backend.selfcheck
      - name: selfcheck must FAIL on an incomplete production config
        run: |
          if MABANIQ_ENV=prod python -m backend.selfcheck; then echo "prod selfcheck passed without secrets — must fail"; exit 1; fi

  test-pg:
    name: pytest + pgTAP (PostgreSQL 17, RLS per organisation) — blocking since Unit 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mabaniq
          POSTGRES_DB: mabaniq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MABANIQ_DATABASE_URL: postgresql://postgres:mabaniq@localhost:5432/mabaniq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: PostgreSQL 17 client tools (pg_dump must match the server major) + pgTAP
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 git make >/dev/null
          git clone --depth 1 --branch v1.3.4 https://github.com/theory/pgtap.git /tmp/pgtap
          psql "$MABANIQ_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /tmp/pgtap/sql/pgtap.sql
      - name: pytest on PostgreSQL (connection pool, RLS, Unit 4 integrity)
        run: python -m pytest tests
      - name: pgTAP — RLS per organisation + updated_at triggers + ledger DELETE revoked
        run: python db/run_pgtap.py
      - name: Backup → restore drill (Unit 4, acceptance 14) — dump, restore into a new database, row counts, audit chain, pgTAP on the copy
        run: python scripts/backup/drill.py --source "$MABANIQ_DATABASE_URL" --target mabaniq_drill --pgtap --pgtap-sql /tmp/pgtap/sql/pgtap.sql
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-drill-report
          path: .local/backup-drill/
          retention-days: 30

  e2e:
    name: Playwright — critical path in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    name: Docker image + /health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t mabaniq:ci .
      - run: |
          docker run -d --name mbq -p 8800:8800 -e MABANIQ_ENV=demo mabaniq:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8800/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8800/version
          docker logs mbq | tail -20
